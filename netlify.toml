# Blue Gecko CMS — public website (Easychoice Holidays tenant).
#
# A SEPARATE Netlify site from both the CMS and the bluegeckotesting
# reference site. Since 13/10/2026 it is linked to its own private repo,
# github.com/DG763-NOW/easychoiceholidays-site, and Netlify deploys branch
# `main` on every push (build command empty). `publish = "."` tells Netlify
# to publish this folder's own contents. See README.md, "Deploying".
#
# Purely static — no functions here. Every page talks to the CMS's own
# API (see assets/config.js's API_BASE) over plain cross-origin fetch
# calls to the public, unauthenticated /v1/public/... endpoints
# documented in the main repo's README.md.

[build]
  publish = "."
